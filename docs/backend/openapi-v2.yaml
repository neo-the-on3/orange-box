            Cache-Control: {$ref: '#/components/headers/CachePrivate'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Region'}}
        '304':
          description: 'Not modified'
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}

  /v1/trips/batch:
    post:
      tags: [trips]
      operationId: uploadTrips
      summary: Upsert a batch of trip summaries (idempotent)
      description: |
        Each trip is keyed by its client-generated `clientTripId`. A trip may be sent several times while
        `state=in_progress` (the app sends periodic snapshots) and finally with `state=completed`; the server
        upserts by (member, `clientTripId`) and ignores snapshots older than the stored `snapshotAt`.
        A `completed` trip is immutable except for deletion. Per-item results are returned; the batch as a whole
        succeeds (`200`) even if some items are rejected.

        A trip whose `clientTripId` has a tombstone (it was deleted) is never recreated: its item gets
        `status=rejected` with `problem.code=trip_deleted`, and the app drops it from its queue. An item whose
        `vehicleId` is not one of the caller's vehicles gets `status=rejected` with `problem.code=vehicle_not_found`.
      x-legacy-mapping:
        replaces: ['/smart.json cmd=carMessage (msgList[].trip, gathering server)']
        notes: Legacy sent base64(gzip(JSON)) in a form field with memberNo/carNo in the body, and trip states opened/updating/closed. v1 uses JSON with optional gzip Content-Encoding and identity from the token.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TripBatch'}
      responses:
        '200':
          description: Per-item results
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/InternalError'}

  /v1/trips:
    get:
      tags: [trips]
      operationId: listTrips
      summary: List trips (newest first, or in change order for incremental sync)
      description: |
        Without `since`, trips are ordered by `startedAt` descending, then `id` (history view, restore). If no
        `vehicleId`, `from` or `to` filter is set, the last page carries `nextSince` to start incremental sync.
        With `since` (a sync token from an earlier walk's `nextSince`), only trips written at or after the token's
        watermark are returned, in server change order, and the last page carries the next token. See
        Conventions → Incremental sync for the inclusive/exclusive rules and the call order with
        `GET /v1/trips/deletions`. Deleted trips never appear here. A `since` token or a `cursor` that can no
        longer be used gets `400` with `code=sync_window_expired` and a `reason` (`deployment_changed`, `purged`
        or `invalid`); on a cursor, restart the walk from its first page, and after `deployment_changed` follow
        the recovery in Conventions → Incremental sync.
      x-legacy-mapping:
        replaces: none
        notes: Legacy had no trip-list JSON API; trip history was shown in server-rendered pages (`/m/view.do`, `/m/chart.do`). Used for restore on a new device.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - {name: vehicleId, in: query, schema: {type: string}}
        - {name: from, in: query, description: 'Trips starting at or after this instant', schema: {type: string, format: date-time}}
        - {name: to, in: query, description: 'Trips starting before this instant', schema: {type: string, format: date-time}}
        - $ref: '#/components/parameters/Since'
      responses:
        '200':
          description: Page of trips
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TripPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}

  /v1/trips/deletions:
    get:
      tags: [trips]
      operationId: listTripDeletions
      summary: Trips deleted since a sync token (incremental sync)
      description: |
        Returns the caller's trip tombstones (per member) written at or after the watermark of `since`, from a
        direct delete or a vehicle cascade, in server change order. Run it after the `GET /v1/trips?since=` walk
        with the **same** `since` value and keep the trips walk's `nextSince` (Conventions → Incremental sync).
        Delivery is at least once. Tombstones are kept for at least 90 days (proposal). An older token, or a token
        or cursor that can no longer be used, gets `400` with `code=sync_window_expired` and a `reason`:
        `purged` (an older token), `deployment_changed` (a token or cursor from before a database restore; follow
        the recovery in Conventions → Incremental sync) or `invalid`. The app then does a full resync
        (`GET /v1/trips` without `since`).
      x-legacy-mapping:
        replaces: none
      parameters:
        - {name: since, in: query, required: true, description: 'Sync token (`nextSince` of an earlier `GET /v1/trips` walk).', schema: {type: string, minLength: 1, maxLength: 512}}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of trip tombstones
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TripDeletionPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}

  /v1/trips/days:
    get:
      tags: [trips]
      operationId: listDrivingDays
      summary: Calendar days on which the caller drove
      x-legacy-mapping:
        replaces: ['POST /m/trip.do?cmd=qSelectUserDrivingTripDate']
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, description: 'Inclusive; max range 366 days', schema: {type: string, format: date}}
        - $ref: '#/components/parameters/Tz'
        - {name: vehicleId, in: query, schema: {type: string}}
      responses:
        '200':
          description: Days with at least one trip
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [date, tripCount]
                      properties:
                        date: {type: string, format: date}
                        tripCount: {type: integer, minimum: 1}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}

  /v1/trips/{tripId}:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [trips]
      operationId: getTrip
      summary: Get one trip summary
      x-legacy-mapping:
        replaces: none
      responses:
        '200':
          description: Trip
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Trip'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [trips]
      operationId: deleteTrip
      summary: Delete a trip with its telemetry
      description: |
        Erases the trip, its samples and events, and leaves a tombstone (see Deletion tombstones). Later snapshots
        or telemetry for the same `clientTripId` are acknowledged without recreating it, and the deletion shows up
        in `GET /v1/trips/deletions`. Deleting an already deleted trip returns `404`.
      x-legacy-mapping:
        replaces: none
      responses:
        '204': {description: 'Deleted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}

  /v1/trips/{tripId}/samples:
    get:
      tags: [telemetry]
      operationId: listTripSamples
      summary: Read back a trip's telemetry samples (chronological)
      x-legacy-mapping:
        replaces: none
      parameters:
        - $ref: '#/components/parameters/TripId'
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 5000, default: 1000}}
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of samples
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SamplePage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}

  /v1/trips/{tripId}/events:
    get:
      tags: [telemetry]
      operationId: listTripEvents
      summary: Read back a trip's driving events
      x-legacy-mapping:
        replaces: none
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of events
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}

  /v1/telemetry/batches:
    post:
      tags: [telemetry]
      operationId: uploadTelemetryBatch
      summary: Upload a batch of telemetry samples and events for one trip
      description: |
        Samples and events are appended to the trip identified by `clientTripId` (the trip summary may arrive
        before or after its telemetry, so an unknown `clientTripId` is normal and is **never** a `404`).
        De-duplication is by `clientBatchId` (and the `Idempotency-Key` header). Individual samples are
        de-duplicated by (`clientTripId`, `t`). An event is a duplicate if it matches an existing event of the trip
        on `clientEventId` (when it has one) **or** on the fallback key (`clientTripId`, `t`, `type`, `active`,
        `dtc`). Both checks always run, so an event first sent without an id and resent with one can't be stored
        twice. In the fallback key an absent `active` counts as `true` (its default), and an absent or `null`
        `dtc` counts as "no code", distinct from every real code. The app should assign `clientEventId` when it
        records the event and send it on every upload. `t` values are truncated to milliseconds (see
        `UtcInstant`) before storage and de-duplication. Processing may be
        asynchronous: `202` means durably stored, not necessarily aggregated.

        The counts in the acknowledgement cover **this batch only**: in-batch duplicates and out-of-range values
        are dropped and counted, but duplicates of samples or events from *earlier* batches are not detected at
        upload time. They are removed when telemetry is read back or compacted, so `GET /v1/trips/{tripId}/samples`
        and `/events` never return duplicates.

        If `clientTripId` has a tombstone (the trip was deleted), the batch is discarded and acknowledged with
        `202` and `status=trip_deleted`, so the app can drop it. Otherwise `vehicleId` must be one of the caller's
        vehicles; if it is not (unknown, another member's, or deleted), the response is `404`.

        Size limits: at most 5,000 samples and 500 events per batch (more is `422` with a pointer), and at most
        1 MiB compressed / 8 MiB uncompressed and 500,000 JSON values per body (more is `413`); see Conventions →
        Request limits.
      x-legacy-mapping:
        replaces: ['/smart.json cmd=carMessage (msgList[].location + msgList[].event, gathering server)']
        notes: Legacy SmartRecord PID fields (vss, ect, maf, map, iat, tp, fli, auxBat ...) are renamed to unit-bearing names; `video` references (dashcam) are dropped.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TelemetryBatch'}
      responses:
        '202':
          description: Accepted and durably stored (or discarded because the trip was deleted, `status=trip_deleted`)
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TelemetryBatchAck'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: |
            `vehicleId` is not one of the caller's vehicles (unknown, another member's, or deleted;
            `code=vehicle_not_found`). Never returned for an unknown `clientTripId`.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/InternalError'}

  /v1/vehicles/{vehicleId}/dtc-reports:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    post:
      tags: [diagnostics]
      operationId: createDtcReport
      summary: Record a diagnostic trouble code (DTC) read or clear
      x-legacy-mapping:
        replaces: ['/smart.json cmd=carMessage (trip.dtcCount/dtcList/pendDtc/permaDtc, event.milWarn/dtc)']
        notes: Legacy embedded DTCs as strings inside trip and event messages. v1 makes a DTC read/clear a first-class record.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DtcReportCreate'}
      responses:
        '200':
          description: Replay. A report with this `clientReportId` (or `Idempotency-Key`) already exists; it is returned unchanged.
          headers:
            Location: {$ref: '#/components/headers/Location'}
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DtcReport'}
        '201':
          description: Created
          headers:
            Location: {$ref: '#/components/headers/Location'}
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DtcReport'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/InternalError'}
    get:
      tags: [diagnostics]
      operationId: listDtcReports
      summary: List DTC reports for a vehicle (newest first)
      x-legacy-mapping:
        replaces: none
        notes: Closest legacy equivalent was the server-rendered `/m/view.do?cmd=vCarDiagList` page.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of reports
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DtcReportPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}

  /v1/stats/summary:

  /v1/trips/batch:
    post:
      tags: [trips]
      operationId: uploadTrips
      summary: Upsert a batch of trip summaries (idempotent)
      description: |
        Each trip is keyed by its client-generated `clientTripId`. A trip may be sent several times while
        `state=in_progress` (the app sends periodic snapshots) and finally with `state=completed`; the server
        upserts by (member, `clientTripId`) and ignores snapshots older than the stored `snapshotAt`.
        A `completed` trip is immutable except for deletion. Per-item results are returned; the batch as a whole
        succeeds (`200`) even if some items are rejected.

        A trip whose `clientTripId` has a tombstone (it was deleted) is never recreated: its item gets
        `status=rejected` with `problem.code=trip_deleted`, and the app drops it from its queue. An item whose
        `vehicleId` is not one of the caller's vehicles gets `status=rejected` with `problem.code=vehicle_not_found`.
      x-legacy-mapping:
        replaces: ['/smart.json cmd=carMessage (msgList[].trip, gathering server)']
        notes: Legacy sent base64(gzip(JSON)) in a form field with memberNo/carNo in the body, and trip states opened/updating/closed. v1 uses JSON with optional gzip Content-Encoding and identity from the token.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TripBatch'}
      responses:
        '200':
          description: Per-item results
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/InternalError'}

  /v1/trips:
    get:
      tags: [trips]
      operationId: listTrips
      summary: List trips (newest first, or by change time for incremental sync)
      description: |
        Without `updatedSince`, trips are ordered by `startedAt` descending, then `id` (history view, restore).
        With `updatedSince`, trips are ordered by **(`updatedAt`, `id`) ascending** so a cursor walk is stable while
        trips keep changing; the app stores the last `updatedAt` it saw and passes it as the next `updatedSince`.
        Deleted trips never appear here; fetch them from `GET /v1/trips/deletions` with the same instant.
      x-legacy-mapping:
        replaces: none
        notes: Legacy had no trip-list JSON API; trip history was shown in server-rendered pages (`/m/view.do`, `/m/chart.do`). Used for restore on a new device.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - {name: vehicleId, in: query, schema: {type: string}}
        - {name: from, in: query, description: 'Trips starting at or after this instant', schema: {type: string, format: date-time}}
        - {name: to, in: query, description: 'Trips starting before this instant', schema: {type: string, format: date-time}}
        - {name: updatedSince, in: query, description: 'Incremental sync - only trips changed after this instant; switches the order to (updatedAt, id) ascending', schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Page of trips
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TripPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}


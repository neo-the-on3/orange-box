        replaces: ['/smart.json cmd=insertCar']
        notes: The legacy OBD adapter Bluetooth MAC (`obdMac`) is not sent; it stays on the device.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VehicleCreate'}
      responses:
        '200':
          description: Replay. The caller already has a vehicle with this `clientVehicleId`; it is returned unchanged.
          headers:
            Location: {$ref: '#/components/headers/Location'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Vehicle'}
        '201':
          description: Created
          headers:
            Location: {$ref: '#/components/headers/Location'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Vehicle'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410':
          description: The caller deleted a vehicle with this `clientVehicleId` within the tombstone retention (`code=vehicle_deleted`). Returned even when a stored `Idempotency-Key` replay exists. Do not retry.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}


    get:
      tags: [trips]
      operationId: listTripDeletions
      summary: Trips deleted since an instant (incremental sync)
      description: |
        Returns tombstones of the caller's trips deleted after `since` (directly or through a vehicle cascade),
        ordered by (`deletedAt`, `id`) ascending. A second device uses it together with
        `GET /v1/trips?updatedSince=` to remove trips deleted elsewhere. Tombstones are kept for at least 90 days
        (proposal); if `since` is older than that, the response is `400` with `code=sync_window_expired` and the
        app does a full resync (`GET /v1/trips` without `updatedSince`).
      x-legacy-mapping:
        replaces: none
      parameters:
        - {name: since, in: query, required: true, schema: {type: string, format: date-time}}

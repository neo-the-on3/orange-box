        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}
    patch:
      tags: [vehicles]
      operationId: updateVehicle
      summary: Update a vehicle (JSON merge patch, optimistic concurrency)
      x-legacy-mapping:
        replaces: ['/smart.json cmd=updateCar']
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/VehiclePatch'}
      responses:
        '200':
          description: Updated
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Vehicle'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [vehicles]
      operationId: deleteVehicle
      summary: Delete a vehicle
      description: |
        Deletes the vehicle. Its trips stay with the member (keeping `vehicleId` as a dangling reference) unless
        `?cascade=true`, which also deletes the vehicle's trips, telemetry and DTC reports and leaves a tombstone for
        each deleted trip (see Deletion tombstones), so a late upload cannot recreate them. Its `clientVehicleId`
        is remembered as well: `POST /v1/vehicles` with it returns `410`.
      x-legacy-mapping:
        replaces: ['/smart.json cmd=updateCar with activeYn=N']
        notes: 'Legacy deactivated a car via updateCar(activeYn=N). Archiving (keep, hide) is PATCH with {"archived": true}; DELETE removes it.'
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - name: cascade
          in: query
          description: Also delete the vehicle's trips (leaving tombstones), telemetry and DTC reports.
          schema: {type: boolean, default: false}
      responses:
        '204': {description: 'Deleted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}


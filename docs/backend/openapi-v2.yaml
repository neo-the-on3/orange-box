        before or after its telemetry, so an unknown `clientTripId` is normal and is **never** a `404`).
        De-duplication is by `clientBatchId` (and the `Idempotency-Key` header). Individual samples are
        de-duplicated by (`clientTripId`, `t`) and events by (`clientTripId`, `t`, `type`). Processing may be
        asynchronous: `202` means durably stored, not necessarily aggregated.

        The counts in the acknowledgement cover **this batch only**: in-batch duplicates and out-of-range values
        are dropped and counted, but duplicates of samples or events from *earlier* batches are not detected at
        upload time. They are removed when telemetry is read back or compacted, so `GET /v1/trips/{tripId}/samples`
        and `/events` never return duplicates.

        If `clientTripId` has a tombstone (the trip was deleted), the batch is discarded and acknowledged with
        `202` and `status=trip_deleted`, so the app can drop it. Otherwise `vehicleId` must be one of the caller's
        vehicles; if it is not (unknown, another member's, or deleted), the response is `404`.

        Size limits (proposal): at most 5,000 samples + 500 events per batch and 1 MiB compressed / 8 MiB
        uncompressed body; otherwise `413`.
      x-legacy-mapping:
        replaces: ['/smart.json cmd=carMessage (msgList[].location + msgList[].event, gathering server)']
        notes: Legacy SmartRecord PID fields (vss, ect, maf, map, iat, tp, fli, auxBat ...) are renamed to unit-bearing names; `video` references (dashcam) are dropped.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TelemetryBatch'}
      responses:
        '202':
          description: Accepted and durably stored (or discarded because the trip was deleted, `status=trip_deleted`)
          headers:
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TelemetryBatchAck'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: |
            `vehicleId` is not one of the caller's vehicles (unknown, another member's, or deleted;
            `code=vehicle_not_found`). Never returned for an unknown `clientTripId`.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/InternalError'}

  /v1/vehicles/{vehicleId}/dtc-reports:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    post:
      tags: [diagnostics]
      operationId: createDtcReport
      summary: Record a diagnostic trouble code (DTC) read or clear
      x-legacy-mapping:
        replaces: ['/smart.json cmd=carMessage (trip.dtcCount/dtcList/pendDtc/permaDtc, event.milWarn/dtc)']
        notes: Legacy embedded DTCs as strings inside trip and event messages. v1 makes a DTC read/clear a first-class record.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DtcReportCreate'}
      responses:
        '200':
          description: Replay. A report with this `clientReportId` (or `Idempotency-Key`) already exists; it is returned unchanged.
          headers:
            Location: {$ref: '#/components/headers/Location'}
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DtcReport'}
        '201':
          description: Created
          headers:
            Location: {$ref: '#/components/headers/Location'}
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DtcReport'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/InternalError'}
    get:
      tags: [diagnostics]
      operationId: listDtcReports
      summary: List DTC reports for a vehicle (newest first)
      x-legacy-mapping:
        replaces: none
        notes: Closest legacy equivalent was the server-rendered `/m/view.do?cmd=vCarDiagList` page.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of reports
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DtcReportPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}

  /v1/stats/summary:
    get:
      tags: [stats]
      operationId: getStatsSummary
      summary: Aggregate driving statistics for a period (Remote-only feature)
      x-legacy-mapping:
        replaces: ['POST /api/v2/trip/stats/getRanking.do (caller aggregate fields of Rank)', 'POST /api/v2/trip/stats/getScoreStar.do']
        notes: The legacy stats charts were server-rendered (`/m/chart.do`) and are not reproducible; v1 returns data only.
      parameters:
        - $ref: '#/components/parameters/Period'
        - {name: date, in: query, description: 'Any date inside the period; defaults to today in `tz`', schema: {type: string, format: date}}
        - $ref: '#/components/parameters/Tz'
        - {name: vehicleId, in: query, schema: {type: string}}
      responses:
        '200':
          description: Aggregates
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatsSummary'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}

  /v1/rankings/{metric}:
    get:
      tags: [rankings]
      operationId: listRanking
      summary: Leaderboard for a metric and period (Remote-only feature)
      description: Only members with `rankingOptIn=true` appear. Entries show the member's chosen `displayName`, never e-mail or login id. Trips with `simulated=true` are excluded.
      x-legacy-mapping:
        replaces: ['POST /api/v2/trip/stats/get*RankingTop10.do (7 variants)', 'POST /api/v2/trip/ranking/getBestTripRankingList.do']
        notes: Legacy ranking DTOs (Rank, MemberEcoData) carry loginId and email of members. v1 must not expose them.
      parameters:
        - $ref: '#/components/parameters/Metric'
        - $ref: '#/components/parameters/Period'
        - {name: date, in: query, schema: {type: string, format: date}}
        - $ref: '#/components/parameters/Tz'
        - {name: regionCode, in: query, schema: {type: string}}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of ranking entries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RankingPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}

  /v1/rankings/{metric}/me:
    get:
      tags: [rankings]
      operationId: getMyRanking
      summary: The caller's position for a metric and period (Remote-only feature)
      x-legacy-mapping:
        replaces: ['POST /api/v2/trip/stats/getRanking.do (ranking fields of Rank)', 'POST /api/v2/trip/ranking/getBestTripMyRanking.do']
      parameters:
        - $ref: '#/components/parameters/Metric'
        - $ref: '#/components/parameters/Period'
        - {name: date, in: query, schema: {type: string, format: date}}
        - $ref: '#/components/parameters/Tz'
      responses:
        '200':
          description: Position
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MyRanking'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: Not ranked for this period (no trips or not opted in)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}

  /v1/me/points:
    get:
      tags: [points]
      operationId: getPointsBalance
      summary: Points balance (Remote-only feature)
      x-legacy-mapping:
        replaces: ['POST /api/v2/trip/stats/getRanking.do (Rank.memberDrvPt/memberLevPt/memberRankPt/memberEvtPt/memberPtAcc/memberPtUse/memberPtRes/memberPtExp)']
        notes: How the legacy server earned or expired points is not visible in the client; the rules are for the backend developer to define.
      responses:
        '200':
          description: Balance
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PointsBalance'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}

  /v1/me/points/ledger:
    get:
      tags: [points]
      operationId: listPointsLedger
      summary: Points history (Remote-only feature)
      x-legacy-mapping:
        replaces: none
        notes: Closest legacy equivalent was the server-rendered `/m/view.do?cmd=vMemberPointLog` page; its content is not known from the client.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of ledger entries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PointsLedgerPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access JWT issued by `POST /v1/auth/token` (ES256 with a `kid` header for key rotation, `iss` = API
        issuer, `aud` = `orange-box-api`, `sub` = member id, `exp` 15 min after issue). The member is always derived
        from `sub`.

  parameters:
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `nextCursor`.
      schema: {type: string, maxLength: 512}
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema: {type: string}
    TripId:
      name: tripId
      in: path
      required: true
      description: Server trip id, or the client trip id prefixed with `client:` (e.g. `client:0192f1b2-...`).
      schema: {type: string}
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        ETag from the last GET/PATCH. **Required by the server** even though it is declared optional: missing → 428
        (enforced in the handler, so a generated validator does not turn it into a generic 400), stale → 412.
      schema: {type: string, maxLength: 256}
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag from an earlier response. If it matches the current representation the server returns `304`.
      schema: {type: string, maxLength: 256}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID chosen by the client per logical upload and reused on every retry of it.
      schema: {type: string, format: uuid}
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, format: uuid}
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: {type: string, format: uuid}
    Tz:
      name: tz
      in: query
      description: IANA time zone used to bucket calendar days and periods (e.g. `Asia/Kolkata`). Default UTC.
      schema: {type: string, default: UTC, maxLength: 64}
    Period:
      name: period
      in: query
      required: true
      schema: {$ref: '#/components/schemas/Period'}
    Metric:
      name: metric
      in: path
      required: true
      schema: {$ref: '#/components/schemas/RankingMetric'}

  headers:
    X-Request-Id:
      schema: {type: string}
    ETag:
      description: Strong entity tag of the returned representation.
      schema: {type: string}
    Location:
      schema: {type: string, format: uri-reference}
    NoStore:
      schema: {type: string, const: no-store}
    CachePrivate:
      description: |
        Catalogue/reference data is cacheable by the app (proposal - `private, max-age=86400`). These operations
        require auth, so the response is `private`, not `public`: shared caches must not serve it to
        unauthenticated clients. Revalidate with `If-None-Match`.
      schema: {type: string}
    RateLimit-Limit:
      schema: {type: integer}
    RateLimit-Remaining:
      schema: {type: integer}
    RateLimit-Reset:
      description: Seconds until the window resets.
      schema: {type: integer}
    Retry-After:
      description: Seconds to wait before retrying.
      schema: {type: integer}

  responses:
    BadRequest:
      description: Malformed request (syntax, bad query parameter, expired cursor)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Missing, invalid or expired token
      headers:
        WWW-Authenticate:
          schema: {type: string}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Resource does not exist or is not owned by the caller
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: An earlier request with the same `Idempotency-Key` is still being processed (`code=idempotency_in_flight`). Safe to retry after a short delay.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionFailed:
      description: If-Match did not match the current ETag
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionRequired:
      description: If-Match header missing
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PayloadTooLarge:
      description: Body exceeds the batch limits
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    UnsupportedMediaType:
      description: Unsupported Content-Type or Content-Encoding
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    UnprocessableContent:
      description: Well-formed but semantically invalid (validation errors, Idempotency-Key reused with a different body)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.example.invalid/problems/validation
            title: Validation failed
            status: 422
            detail: 2 fields are invalid
            instance: /v1/vehicles
            code: validation_failed
            requestId: 0192f1b2-7c1e-7a55-9f0e-2b1d7d2c9a10
            errors:
              - {pointer: /modelYear, detail: must be between 1980 and 2100}
              - {pointer: /vin, detail: must be 17 characters}
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After: {$ref: '#/components/headers/Retry-After'}
        RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
        RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
        RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    InternalError:
      description: Unexpected server error (`500`, `502`, `503`, `504`). Never contains stack traces or PII.
      headers:
        Retry-After: {$ref: '#/components/headers/Retry-After'}
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            code: internal_error
            requestId: 0192f1b2-7c1e-7a55-9f0e-2b1d7d2c9a13
    ServiceUnavailable:
      description: Temporarily unavailable / maintenance
      headers:
        Retry-After: {$ref: '#/components/headers/Retry-After'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. Never contains PII, tokens or stack traces.
      required: [type, title, status, requestId]
      properties:
        type: {type: string, format: uri-reference, default: about:blank}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        code:
          type: string
          description: Stable machine-readable code (e.g. `validation_failed`, `idempotency_key_reused`, `token_expired`, `invalid_grant`, `otp_attempts_exceeded`, `otp_locked`, `test_address_rejected`, `internal_error`, `etag_mismatch`, `batch_too_large`, `unsupported_encoding`, `idempotency_in_flight`, `vehicle_deleted`, `vehicle_not_found`, `trip_deleted`, `sync_window_expired`).
        requestId: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [pointer, detail]
            properties:
              pointer: {type: string, description: 'JSON Pointer (RFC 6901) into the request body'}
              detail: {type: string}
    Health:
      type: object
      required: [status, apiVersion, time]
      properties:
        status: {type: string, enum: [ok, degraded]}
        apiVersion: {type: string, examples: [1.0.0]}
        time: {type: string, format: date-time}
    PageMeta:
      type: object
      required: [nextCursor]
      properties:
        nextCursor: {type: [string, 'null']}

    TokenRequest:
      oneOf:
        - $ref: '#/components/schemas/EmailOtpGrant'
        - $ref: '#/components/schemas/RefreshGrant'
      discriminator:
        propertyName: grantType
        mapping:
          email_otp: '#/components/schemas/EmailOtpGrant'
          refresh_token: '#/components/schemas/RefreshGrant'
    OtpRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 254, description: 'Trimmed and normalised to lower case by the server.'}
    OtpResponse:
      type: object
      required: [expiresIn]
      properties:
        expiresIn: {type: integer, description: 'Seconds until the code expires (600).', examples: [600]}
        resendAfter: {type: integer, minimum: 0, description: 'Seconds before the app should offer to resend a code.'}
    EmailOtpGrant:
      type: object
      additionalProperties: false
      required: [grantType, email, code]
      properties:
        grantType: {type: string, const: email_otp}
        email: {type: string, format: email, maxLength: 254, description: 'The address the code was sent to (same normalisation as `POST /v1/auth/otp`). In test mode only (ENV local, ci or sandbox; never in production), addresses ending in `@test.orangebox.invalid` accept the static `AUTH_TEST_CODE`; with test mode off they are rejected with `422` (`test_address_rejected`).'}
        code: {type: string, pattern: '^[0-9]{6}$', description: '6-digit one-time code from the e-mail. Sent as a string to keep leading zeros.'}
        device:
          type: object
          description: Optional. Stored with the refresh-token family for support and a possible future session list; no endpoint exposes it in v1. No hardware identifiers.
          additionalProperties: false
          properties:
            appVersion: {type: string, maxLength: 32}
            osVersion: {type: string, maxLength: 64}
    RefreshGrant:
      type: object
      additionalProperties: false
      required: [grantType, refreshToken]
      properties:
        grantType: {type: string, const: refresh_token}
        refreshToken: {type: string, minLength: 1, maxLength: 512}
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, refreshToken, refreshExpiresIn, memberId, isNewMember]
      properties:
        accessToken: {type: string}
        tokenType: {type: string, const: Bearer}
        expiresIn: {type: integer, description: 'Access token lifetime in seconds (900).'}
        refreshToken: {type: string}
        refreshExpiresIn: {type: integer, description: 'Refresh token lifetime in seconds (2592000 = 30 days).'}
        memberId: {type: string}
        isNewMember: {type: boolean}

    Profile:
      type: object
      required: [id, displayName, email, createdAt, updatedAt]
      properties:
        id: {type: string, readOnly: true}
        displayName: {type: string, minLength: 1, maxLength: 40, description: 'Shown on leaderboards. Legacy memberNm.'}
        email: {type: string, format: email, readOnly: true, description: 'Verified sign-in e-mail address (verified by the one-time code), normalised to lower case and unique per member. Used to sign in; never accepted as an identifier in requests.'}
        countryCode: {type: [string, 'null'], pattern: '^[A-Z]{2}$', description: 'ISO 3166-1 alpha-2. Legacy countryCd.'}
        regionCode: {type: [string, 'null'], description: 'ISO 3166-2 subdivision. Legacy localCd.'}
        rankingOptIn: {type: boolean, default: false}
        authProvider: {type: string, readOnly: true, enum: [email_otp], description: 'Sign-in method. Only `email_otp` in v1; new values may be added. Replaces the legacy joinRouteCd social-login values, which are not carried over.'}
        createdAt: {type: string, format: date-time, readOnly: true}
        updatedAt: {type: string, format: date-time, readOnly: true}
    ProfilePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: {type: string, minLength: 1, maxLength: 40}
        countryCode: {type: [string, 'null'], pattern: '^[A-Z]{2}$'}
        regionCode: {type: [string, 'null']}
        rankingOptIn: {type: boolean}
    AccountDeletion:
      type: object
      required: [status, requestedAt, completeBy]
      properties:
        status: {type: string, enum: [scheduled, completed]}
        requestedAt: {type: string, format: date-time}
        completeBy: {type: string, format: date-time}

    CountryCode:
      type: string
      pattern: '^[A-Z]{2}$'
      description: ISO 3166-1 alpha-2
    FuelType:
      type: string
      description: 'Legacy CarSrcCd (gasolineLpg → gasoline_lpg) plus plug_in_hybrid and other. Unknown future values must be tolerated.'
      enum: [gasoline, diesel, lpg, gasoline_lpg, hybrid, plug_in_hybrid, electric, other]
    BodyType:
      type: string
      description: 'Legacy CarTypeCd.'
      enum: [micro, subcompact, compact, midsize, fullsize, fullsize_luxury, suv, van, sports, other]
    Period:
      type: string
      enum: [day, week, month, year, all]
    RankingMetric:
      type: string
      description: 'Legacy *RankingTop10 variants (DrivingScore, EcoSpeed, FuelCut, HarshSpeed, Level, Point, FuelSave) plus best_trip.'
      enum: [driving_score, eco_speed, fuel_cut, harsh_driving, level, points, fuel_saved, best_trip]
    EventType:
      type: string
      description: 'Legacy EventTpCd plus SmartEvent warning flags, plus overspeed/idling. Dashcam-related events are out of scope.'
      enum: [connection_warning, battery_warning, low_fuel_warning, mil_on, coolant_temp_warning, harsh_start, harsh_accel, harsh_stop, harsh_brake, overspeed, idling, impact, emergency, other]

    ObdAdapterInfo:
      type: object
      description: 'Adapter metadata useful for support. Legacy elmVer/protocol. The Bluetooth MAC (legacy obdMac) is not sent.'
      properties:
        elmVersion: {type: string, maxLength: 32}
        obdProtocol: {type: integer, minimum: 0, maximum: 12, description: 'ELM327 protocol number (ATDPN)'}
    VehicleWritable:
      type: object
      properties:
        nickname: {type: string, maxLength: 40}
        variantId: {type: [string, 'null'], description: 'Catalogue variant, or null for manual entry'}
        make: {type: string, maxLength: 64}
        model: {type: string, maxLength: 64}
        fuelType: {$ref: '#/components/schemas/FuelType'}
        engineDisplacementCc: {type: [integer, 'null'], minimum: 0, maximum: 10000}
        modelYear: {type: [integer, 'null'], minimum: 1980, maximum: 2100}
        plateNumber: {type: [string, 'null'], maxLength: 16, description: 'Optional; personal data. Legacy carPlateNo.'}
        vin: {type: [string, 'null'], pattern: '^[A-HJ-NPR-Z0-9]{17}$', description: Optional; personal data.}
        odometerKm: {type: [integer, 'null'], minimum: 0}
        idleStopGo: {type: boolean, description: 'Legacy isgYn'}
        obdAdapter: {$ref: '#/components/schemas/ObdAdapterInfo'}
        archived: {type: boolean, description: 'Legacy activeYn=N'}
    VehicleCreate:
      allOf:
        - $ref: '#/components/schemas/VehicleWritable'
        - type: object
          required: [make, model, fuelType]
          properties:
            clientVehicleId: {type: string, format: uuid, description: 'Local id from the app, for de-duplication'}
    VehiclePatch:
      allOf:
        - $ref: '#/components/schemas/VehicleWritable'
        - type: object
          minProperties: 1
    Vehicle:
      allOf:
        - $ref: '#/components/schemas/VehicleWritable'
        - type: object
          required: [id, make, model, fuelType, archived, createdAt, updatedAt]
          properties:
            id: {type: string, readOnly: true}
            clientVehicleId: {type: [string, 'null'], format: uuid}
            createdAt: {type: string, format: date-time, readOnly: true}
            updatedAt: {type: string, format: date-time, readOnly: true}
    VehiclePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Vehicle'}}

    Make:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    Model:
      type: object
      required: [id, makeId, name]
      properties:
        id: {type: string}
        makeId: {type: string}
        name: {type: string}
        bodyType: {$ref: '#/components/schemas/BodyType'}
        firstYear: {type: [integer, 'null']}
        lastYear: {type: [integer, 'null']}
    Variant:
      type: object
      description: 'Legacy SmartCarModel.'
      required: [id, makeId, modelId, fuelType]
      properties:
        id: {type: string}
        makeId: {type: string}
        modelId: {type: string}
        name: {type: string}
        fuelType: {$ref: '#/components/schemas/FuelType'}
        engineDisplacementCc: {type: [integer, 'null']}
        releaseYear: {type: [integer, 'null']}
        discontinuedYear: {type: [integer, 'null']}
        officialFuelEconomyKmPerL: {type: [number, 'null'], format: double, description: 'Legacy fuelEconomy (unit inferred as km/L)'}
        imageUrl: {type: [string, 'null'], format: uri, description: 'Absolute HTTPS URL (legacy carImageFile was a path relative to the service base URL)'}
    MakePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Make'}}
    ModelPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Model'}}
    VariantPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Variant'}}
            facets:
              type: object
              properties:
                fuelType: {type: array, items: {$ref: '#/components/schemas/FuelType'}}
                displacementCc: {type: array, items: {type: integer}}
                year: {type: array, items: {type: integer}}
    Country:
      type: object
      required: [code, name]
      properties:
        code: {$ref: '#/components/schemas/CountryCode'}
        name: {type: string}
    Region:
      type: object
      required: [code, name]
      properties:
        code: {type: string, description: 'ISO 3166-2 (e.g. IN-KA)'}
        name: {type: string}

    SpeedBand:
      type: object
      required: [fromKmh, seconds]
      properties:
        fromKmh: {type: integer, minimum: 0}
        toKmh: {type: [integer, 'null'], description: 'null means open-ended (legacy timeIn110Over)'}
        seconds: {type: number, format: double, minimum: 0}
    DtcCode:
      type: string
      pattern: '^[PCBU][0-9A-F]{4}$'
    DtcSet:
      type: object
      properties:
        stored: {type: array, items: {$ref: '#/components/schemas/DtcCode'}}
        pending: {type: array, items: {$ref: '#/components/schemas/DtcCode'}}
        permanent: {type: array, items: {$ref: '#/components/schemas/DtcCode'}}
    TripUpload:
      type: object
      description: 'Trip summary. Legacy SmartTrip, minus ip/weather/mobileCarrier (unnecessary personal data), fuelEconomyA/B/C and maxHp/maxTorq (meaning or source not documented in the client).'
      required: [clientTripId, vehicleId, state, startedAt, snapshotAt]
      properties:
        clientTripId: {type: string, format: uuid}
        vehicleId: {type: string, description: 'Server vehicle id'}
        state: {type: string, enum: [in_progress, completed], description: 'Legacy opened/updating → in_progress, closed → completed'}
        startedAt: {type: string, format: date-time}
        endedAt: {type: [string, 'null'], format: date-time}
        snapshotAt: {type: string, format: date-time, description: 'When the app computed this snapshot; older snapshots are ignored'}
        durationS: {type: integer, minimum: 0}
        distanceKm: {type: number, format: double, minimum: 0}
        engineDistanceKm: {type: [number, 'null'], format: double}
        maxSpeedKmh: {type: number, format: double}
        avgSpeedKmh: {type: number, format: double}
        maxRpm: {type: integer}
        harshAccelCount: {type: integer, minimum: 0}
        harshBrakeCount: {type: integer, minimum: 0, description: 'Legacy harshDecelCount'}
        harshStartCount: {type: integer, minimum: 0}
        harshStopCount: {type: integer, minimum: 0}
        fuelUsedL: {type: [number, 'null'], format: double, description: 'Legacy fuelConsumption'}
        fuelEconomyKmPerL: {type: [number, 'null'], format: double}
        fuelCutTimeS: {type: number, format: double}
        idleTimeS: {type: number, format: double}
        warmUpTimeS: {type: number, format: double}
        accelTimeS: {type: number, format: double}
        ecoSpeedTimeS: {type: number, format: double}
        overSpeedTimeS: {type: number, format: double}
        speedBands: {type: array, items: {$ref: '#/components/schemas/SpeedBand'}, description: 'Legacy timeIn0To10 … timeIn110Over'}
        ecoScore: {type: [number, 'null'], format: double, description: 'Client-computed (clean-room formula, see docs/telemetry.md). Legacy ecoSafePoint.'}
        safetyScore: {type: [number, 'null'], format: double, description: 'Legacy safePoint'}
        batteryMaxV: {type: [number, 'null'], format: double}
        batteryAvgV: {type: [number, 'null'], format: double}
        coolantMaxC: {type: [number, 'null'], format: double}
        coolantAvgC: {type: [number, 'null'], format: double}
        dtc: {$ref: '#/components/schemas/DtcSet'}
        simulated: {type: boolean, default: false, description: 'True when recorded with the debug simulator; excluded from rankings. Legacy simulatedYn.'}
        app:
          type: object
          properties:
            version: {type: string}
            os: {type: string, examples: [android]}
            osVersion: {type: string}
    Trip:
      allOf:
        - $ref: '#/components/schemas/TripUpload'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: {type: string}
            pointsAwarded: {type: [integer, 'null'], description: 'Remote-only'}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    TripBatch:
      type: object
      required: [trips]
      properties:
        trips: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/TripUpload'}}
    BatchResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [clientId, status]
            properties:
              clientId: {type: string, format: uuid}
              status: {type: string, enum: [created, updated, unchanged, rejected]}
              id: {type: [string, 'null'], description: 'Server id when accepted'}
              problem: {$ref: '#/components/schemas/Problem'}
    TripDeletion:
      type: object
      description: Tombstone of a deleted trip. Holds no trip data.
      required: [id, clientTripId, deletedAt]
      properties:
        id: {type: string, description: Server trip id}
        clientTripId: {type: string, format: uuid}
        vehicleId: {type: [string, 'null'], description: 'Vehicle the trip belonged to, if known'}
        deletedAt: {type: string, format: date-time}
    TripDeletionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/TripDeletion'}}
    TripPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Trip'}}

    Sample:
      type: object
      description: 'One OBD/location sample. Legacy SmartRecord - vss→speedKmh, rpm, maf→mafGps, map→mapKpa, iat→intakeAirC, ect→coolantC, loadPct→engineLoadPct, tp→throttlePct, fli→fuelLevelPct, auxBat→batteryV, mil, x/y/zAxis→accel.'
      required: [t]
      properties:
        t: {type: string, format: date-time}
        lat: {type: [number, 'null'], format: double, minimum: -90, maximum: 90}
        lon: {type: [number, 'null'], format: double, minimum: -180, maximum: 180}
        speedKmh: {type: [number, 'null'], format: double}
        rpm: {type: [number, 'null'], format: double}
        mafGps: {type: [number, 'null'], format: double, description: 'g/s'}
        mapKpa: {type: [number, 'null'], format: double}
        intakeAirC: {type: [number, 'null'], format: double}
        coolantC: {type: [number, 'null'], format: double}
        engineLoadPct: {type: [number, 'null'], format: double}
        throttlePct: {type: [number, 'null'], format: double}
        fuelLevelPct: {type: [number, 'null'], format: double}
        batteryV: {type: [number, 'null'], format: double}
        mil: {type: [boolean, 'null']}
        accel:
          type: object
          description: m/s² in device frame
          properties:
            x: {type: number, format: double}
            y: {type: number, format: double}
            z: {type: number, format: double}
        pids:
          type: object
          description: Extra SAE J1979 mode 01 values keyed by hex PID (e.g. `"0x0B"`), already scaled to SI units.
          additionalProperties: {type: number, format: double}
    Event:
      type: object
      required: [t, type]
      properties:
        t: {type: string, format: date-time}
        type: {$ref: '#/components/schemas/EventType'}
        active: {type: boolean, default: true, description: 'Warning started (true) or cleared (false). Legacy ThreeState Y/N.'}
        lat: {type: [number, 'null'], format: double, minimum: -90, maximum: 90}
        lon: {type: [number, 'null'], format: double, minimum: -180, maximum: 180}
        dtc: {type: [string, 'null'], pattern: '^[PCBU][0-9A-F]{4}$'}
        value: {type: [number, 'null'], format: double, description: 'Measured value that triggered the event (e.g. g-force, km/h, V)'}
    TelemetryBatch:
      type: object
      required: [clientBatchId, clientTripId, vehicleId]
      properties:
        clientBatchId: {type: string, format: uuid}
        clientTripId: {type: string, format: uuid}
        vehicleId: {type: string}
        samples: {type: array, maxItems: 5000, items: {$ref: '#/components/schemas/Sample'}}
        events: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/Event'}}
    TelemetryBatchAck:
      type: object
      required: [clientBatchId, status, acceptedSamples, acceptedEvents]
      properties:
        clientBatchId: {type: string, format: uuid}
        status: {type: string, enum: [accepted, duplicate, trip_deleted], description: '`duplicate`: this `clientBatchId` was already stored (the original counts are returned). `trip_deleted`: the trip has a tombstone; nothing was stored.'}
        acceptedSamples: {type: integer, minimum: 0, description: 'Samples stored from this batch (0 for `trip_deleted`).'}
        acceptedEvents: {type: integer, minimum: 0, description: 'Events stored from this batch (0 for `trip_deleted`).'}
        droppedSamples: {type: integer, minimum: 0, description: 'Samples dropped within this batch (in-batch duplicates or out-of-range values). Duplicates of earlier batches are not counted; they are removed on read-back or compaction.'}
        droppedEvents: {type: integer, minimum: 0, description: 'Events dropped within this batch, on the same terms as `droppedSamples`.'}
    SamplePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Sample'}}
    EventPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Event'}}

    DtcReportCreate:
      allOf:
        - $ref: '#/components/schemas/DtcSet'
        - type: object
          required: [clientReportId, kind, readAt, mil]
          properties:
            clientReportId: {type: string, format: uuid}
            kind: {type: string, enum: [read, cleared]}
            readAt: {type: string, format: date-time}
            mil: {type: boolean}
            vin: {type: [string, 'null'], pattern: '^[A-HJ-NPR-Z0-9]{17}$'}
            clientTripId: {type: [string, 'null'], format: uuid}
            odometerKm: {type: [integer, 'null']}
            distanceSinceMilKm: {type: [integer, 'null'], description: 'PID 0x21'}
    DtcReport:
      allOf:
        - $ref: '#/components/schemas/DtcReportCreate'
        - type: object
          required: [id, vehicleId, createdAt]
          properties:
            id: {type: string}
            vehicleId: {type: string}
            createdAt: {type: string, format: date-time}
    DtcReportPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/DtcReport'}}

    StatsSummary:
      type: object
      description: 'Legacy Rank aggregate fields plus ScoreRank stars.'
      required: [period, from, to, tripCount]
      properties:
        period: {type: string, enum: [day, week, month, year, all]}
        from: {type: string, format: date}
        to: {type: string, format: date}
        vehicleId: {type: [string, 'null']}
        tripCount: {type: integer}
        durationS: {type: integer}
        distanceKm: {type: number, format: double}
        fuelUsedL: {type: [number, 'null'], format: double}
        fuelEconomyKmPerL: {type: [number, 'null'], format: double}
        harshAccelCount: {type: integer}
        harshBrakeCount: {type: integer}
        idleTimeS: {type: number, format: double}
        normalSpeedTimeS: {type: number, format: double}
        ecoSpeedTimeS: {type: number, format: double}
        overSpeedTimeS: {type: number, format: double}
        fuelCutTimeS: {type: number, format: double}
        highLoadTimeS: {type: number, format: double}
        maxSpeedKmh: {type: [number, 'null'], format: double}
        drivingScore: {type: [number, 'null'], format: double, minimum: 0, maximum: 100}
        level: {type: [integer, 'null']}
        scoreStars:
          type: object
          description: 0-5 stars per category (legacy *ScoreStar)
          properties:
            harshDriving: {type: integer, minimum: 0, maximum: 5}
            idling: {type: integer, minimum: 0, maximum: 5}
            normalSpeed: {type: integer, minimum: 0, maximum: 5}
            ecoSpeed: {type: integer, minimum: 0, maximum: 5}
            overSpeed: {type: integer, minimum: 0, maximum: 5}
            highLoad: {type: integer, minimum: 0, maximum: 5}
            fuelCut: {type: integer, minimum: 0, maximum: 5}
        fuelCost:
          type: [object, 'null']
          properties:
            amount: {type: number, format: double}
            saved: {type: number, format: double}
            currency: {type: string, pattern: '^[A-Z]{3}$'}
    RankingEntry:
      type: object
      required: [rank, displayName, value, isMe]
      properties:
        rank: {type: integer, minimum: 1}
        displayName: {type: string}
        regionCode: {type: [string, 'null']}
        vehicleLabel: {type: [string, 'null'], description: 'e.g. make and model; never plate or VIN'}
        value: {type: number, format: double}
        isMe: {type: boolean}
    RankingPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [metric, period, periodStart, items]
          properties:
            metric: {$ref: '#/components/schemas/RankingMetric'}
            period: {$ref: '#/components/schemas/Period'}
            periodStart: {type: string, format: date}
            items: {type: array, items: {$ref: '#/components/schemas/RankingEntry'}}
    MyRanking:
      type: object
      required: [metric, period, rank, participants, value]
      properties:
        metric: {$ref: '#/components/schemas/RankingMetric'}
        period: {$ref: '#/components/schemas/Period'}
        rank: {type: integer, minimum: 1}
        participants: {type: integer}
        value: {type: number, format: double}
        percentile: {type: number, format: double, minimum: 0, maximum: 100}
    PointsBalance:
      type: object
      required: [earned, used, remaining]
      properties:
        earned: {type: integer, description: 'Legacy memberPtAcc'}
        used: {type: integer, description: 'Legacy memberPtUse'}
        remaining: {type: integer, description: 'Legacy memberPtRes'}
        expiringSoon: {type: integer, description: 'Legacy memberPtExp'}
        expiringAt: {type: [string, 'null'], format: date-time}
        byCategory:
          type: object
          description: 'Legacy memberDrvPt / memberLevPt / memberRankPt / memberEvtPt'
          properties:
            driving: {type: integer}
            level: {type: integer}
            ranking: {type: integer}
            event: {type: integer}
    PointsLedgerEntry:
      type: object
      required: [id, occurredAt, category, amount]
      properties:
        id: {type: string}
        occurredAt: {type: string, format: date-time}
        category: {type: string, enum: [driving, level, ranking, event, redemption, expiry, adjustment]}
        amount: {type: integer, description: 'Positive = earned, negative = used or expired'}
        tripId: {type: [string, 'null']}
        description: {type: string}
    PointsLedgerPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/PointsLedgerEntry'}}

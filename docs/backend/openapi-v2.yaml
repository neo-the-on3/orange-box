            RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VehiclePage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}
    post:
      tags: [vehicles]
      operationId: createVehicle
      summary: Register a vehicle
      description: |
        De-duplicated by `clientVehicleId`. If the caller already has a vehicle (archived or not) with the same
        `clientVehicleId`, nothing is created or changed and the existing vehicle is returned with `200`, whatever
        the body says; the app then uses `PATCH` with its `ETag` to change it. This makes a retry safe even under a
        new `Idempotency-Key`. If that vehicle was deleted, the response is `410` (`code=vehicle_deleted`) and the
        app must not retry.
      x-legacy-mapping:
        replaces: ['/smart.json cmd=insertCar']
        notes: The legacy OBD adapter Bluetooth MAC (`obdMac`) is not sent; it stays on the device.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VehicleCreate'}
      responses:
        '200':
          description: Replay. The caller already has a vehicle with this `clientVehicleId`; it is returned unchanged.
          headers:
            Location: {$ref: '#/components/headers/Location'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Vehicle'}
        '201':
          description: Created
          headers:
            Location: {$ref: '#/components/headers/Location'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Vehicle'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410':
          description: A vehicle with this `clientVehicleId` was deleted (`code=vehicle_deleted`). Do not retry.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

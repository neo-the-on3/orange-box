openapi: 3.1.0
info:
  title: Orange Box API
  version: 1.0.0-draft.9
  summary: REST API (v1) for the optional Orange Box backend. Replaces the legacy CarooLive RPC contract.
  description: |
    Contract for the **optional** backend of the Orange Box Android app (`io.github.neotheon3.orangebox`).
    The app is fully functional without a backend. Its backend mode is **Off** (default), **Fake**
    (canned responses generated from this spec, no network) or **Remote** (this API).

    This API is a clean redesign. The legacy, reverse-documented contract (RPC over `POST /smart.json`
    multiplexed by `cmd`, form-encoded JSON strings, client-asserted identity, plain HTTP) is kept only as a
    reference in `docs/openapi.yaml`. Every operation below carries an `x-legacy-mapping` naming what it
    replaces. `none` means the operation is new.

    ## Conventions
    * **Transport**: HTTPS only (TLS 1.2+). Plain HTTP must be refused, not redirected.
    * **Auth**: `Authorization: Bearer <JWT>` on every operation except `GET /v1/health`, `POST /v1/auth/otp` and
      `POST /v1/auth/token`.
      The member is identified by the token's subject. Member ids are **never** accepted in request bodies or
      query strings for authorisation.
    * **Media types**: `application/json` (UTF-8) for requests and responses; `application/merge-patch+json`
      (RFC 7396) for PATCH; `application/problem+json` (RFC 9457) for every error.
    * **Compression**: clients may send `Content-Encoding: gzip` on the batch upload operations
      (`POST /v1/trips/batch`, `POST /v1/telemetry/batches`, `POST /v1/vehicles/{vehicleId}/dtc-reports`).
      `Content-Encoding` is a representation header, not an API parameter, so it is not declared as one: the server
      decompresses the body before schema validation, enforcing the uncompressed size limit while it inflates. A
      missing header or `identity` means an uncompressed body; any other value (e.g. `br`, `deflate`), or
      `Content-Encoding` on any other operation, returns `415` (`code=unsupported_encoding`). Servers should honour
      `Accept-Encoding: gzip` on responses.
    * **Time**: all timestamps are RFC 3339 / ISO-8601 in UTC with a `Z` suffix (e.g. `2026-10-23T14:05:00Z`).
      Calendar dates (`YYYY-MM-DD`) are interpreted in the IANA time zone passed in the `tz` query parameter where
      one exists, otherwise UTC.
    * **Units**: metric units encoded in field names (`distanceKm`, `speedKmh`, `durationS`, `fuelUsedL`,
      `coolantC`, `batteryV`). Fuel economy is km/L. The app converts for display.
    * **Ids**: server ids are opaque strings (UUIDv7 recommended). Client-generated ids (`clientTripId`,
      `clientBatchId`, `clientReportId`, `clientVehicleId`) are UUIDs used for de-duplication.
    * **Pagination**: cursor based. Request `?limit=` (1-100, default 50) and `?cursor=`; responses return
      `items` and `nextCursor` (`null` on the last page). Cursors are opaque and may expire (then `400`).
      Exception: `GET /v1/trips/{tripId}/samples` allows `limit` up to 5000 (default 1000), because a 1-hour drive
      at 1 Hz is about 3,600 samples.
    * **Concurrency**: mutable resources return `ETag`; `PATCH`/`DELETE` on vehicles and `PATCH /v1/me` require
      `If-Match` (`428` if missing, `412` if stale). `If-Match` is declared optional so that a generated server
      can answer `428` itself instead of a generic `400`; handlers must enforce it. Every resource also exposes
      `updatedAt`. Operations that document `304` accept `If-None-Match`.
    * **Idempotency**: `Idempotency-Key` header (UUID) is required on batch uploads and accepted on other POSTs.
      Keys are scoped per **(member, HTTP method, route template)** (e.g. `POST /v1/vehicles/{vehicleId}/dtc-reports`
      with the path parameters part of the fingerprint): the same UUID sent by another member, or to another route,
      is a different key and can never replay someone else's stored response. The server stores the key with a
      request fingerprint (path parameters plus the decompressed body) and the response for at least 24 h
      (proposal). A retry with the same key and fingerprint returns the original response (same status and body);
      the same key with a different fingerprint returns `422` (`code=idempotency_key_reused`); a retry while the
      first request is still processing returns `409` (`code=idempotency_in_flight`). `409` is used for nothing
      else, so clients can always retry it. Exception: a deletion tombstone beats a stored replay. A retry of
      `POST /v1/vehicles` whose vehicle has since been deleted gets `410` (`code=vehicle_deleted`), not the stored
      `201`.
    * **Deletion tombstones**: deleting a trip (directly, or through `DELETE /v1/vehicles/{vehicleId}?cascade=true`)
      erases its data and leaves a tombstone holding only the server id, the `clientTripId` and `deletedAt`.
      Deleting a vehicle likewise leaves a tombstone for its `clientVehicleId`. Tombstones are **scoped per member**
      (keyed by member plus `clientTripId` or `clientVehicleId`): another member's identical client id is
      unaffected. Late uploads for a tombstoned `clientTripId` are acknowledged but never recreate the trip,
      `POST /v1/vehicles` with a tombstoned `clientVehicleId` returns `410`, and incremental sync reports trip
      deletions through `GET /v1/trips/deletions`. Both kinds of tombstone are kept for at least 90 days after
      `deletedAt` (proposal; longer than the app's 30-day upload backlog) and are erased with the account. After
      that, a trip or vehicle upload with the same client id is treated as new.
    * **Incremental sync (sync tokens)**: `GET /v1/trips` and `GET /v1/trips/deletions` use an opaque,
      server-issued sync token instead of a client-remembered timestamp.
      - The last page of a walk (`nextCursor: null`) carries `nextSince`, which the app stores and passes back as
        `since`. It is returned even when there are no changes, so the app always gets a fresh token. Earlier
        pages have `nextSince: null`. A full `GET /v1/trips` walk without `since` also ends with `nextSince`, which
        is how a new device starts syncing. `since` cannot be combined with `vehicleId`, `from` or `to` (`400`),
        and a walk that uses those filters returns `nextSince: null`. The cursor carries the walk's watermark, so
        later pages need only `cursor`. If `since` is sent with a `cursor`, it must be the walk's original `since`,
        or the response is `400` with `code=bad_request` (a client bug, not a `sync_window_expired`: don't restart
        the walk, send the walk's original `since` or none).
      - **Token contents.** The token is opaque to the app: base64url, integrity-protected with a server key (HMAC)
        so it can't be forged or edited. It carries a format version, the deployment identity, the issue time
        (`issuedAt`) and the watermark below. The deployment identity combines the Postgres cluster's
        `system_identifier` (from `pg_control_system()`; left out where the server is configured not to read it)
        with a configured deployment id that operators change after every database restore, point-in-time recovery or
        branch reset. Page cursors of `GET /v1/trips` and `GET /v1/trips/deletions` carry the same identity. A
        token or cursor with a different version or deployment identity, or one that fails the integrity check,
        is rejected with `400` (`code=sync_window_expired`); so is a cursor sent to another endpoint, walk or
        filter than the one it came from. That way a restore from backup, dump/restore or migration to a new cluster,
        where transaction ids mean something else, can never silently skip writes. A server instance whose
        database endpoint starts reaching another cluster while it runs (e.g. a blue/green switchover or a
        failover behind the same address), or a cluster it can no longer check, answers `503`
        (`code=service_unavailable`) to every request instead of serving sync, until it is restarted. It
        notices within a bounded time, 20 s by default (the server's check interval, 10–30 s, plus up to 5 s),
        however busy it is, as long as its check can connect (it reports itself unhealthy, without answering
        `503` to requests, after 3 failed checks in a row, and healthy again after a good one); clients retry,
        then get `deployment_changed`. Writes accepted in that window go to the old cluster: the app gets its
        trips back by re-uploading them after `deployment_changed`, but deletions and vehicle edits made in the
        window are lost, so trips deleted in it may reappear. (A server configured not to read
        `system_identifier` can't notice this; its operators change the deployment id and restart instead.) Tokens are issued and read on the
        **primary** only, never on a read replica.
      - **Why a token was rejected (`reason`).** A `sync_window_expired` problem carries a machine-readable
        `reason`: `deployment_changed` when the token or cursor was issued under another deployment identity (the
        database was restored or replaced since, and may have lost writes made after its restore point),
        `purged` when tombstones it depends on were purged (see window expiry below), and `invalid` when it
        fails to decode or verify (e.g. it was edited, belongs to another member, or the signing key was
        rotated, or a cursor is used with another endpoint, walk or filter). Every reason means the same first
        step: a full `GET /v1/trips` walk without `since`. Clients must treat an unknown or missing `reason` like
        `invalid`. A `sync_window_expired` on a **cursor**, i.e. in the middle of any walk (a full one
        included), means: discard what the walk collected and restart it from its first page, without `since`.
      - **Recovery after `deployment_changed`.** Only for this reason, the app:
        1. Does the full walk of `GET /v1/trips` and keeps its `nextSince`.
        2. Re-creates every local vehicle the server no longer returns (`POST /v1/vehicles` with its
           `clientVehicleId`; it gets a new server id) and points its local trips at the new id. A `410`
           (`code=vehicle_deleted`) means the vehicle was deleted before the restore point and its tombstone
           survived: the app deletes the vehicle locally, with its local trips that the walk didn't return
           (they were deleted with it, or belong to a deleted vehicle), and doesn't upload them.
        3. Re-uploads, through `POST /v1/trips/batch` with fresh `Idempotency-Key`s, every local trip whose
           `clientTripId` the full walk didn't return, except trips the user deleted on this device.
        4. Updates the local server `id` of each re-uploaded trip from the batch result, matching by
           `clientTripId` (a re-created trip gets a new server id).

        Re-uploading is safe: trips are keyed by (member, `clientTripId`), so a trip the server still has comes
        back `unchanged` (or `updated` if the local snapshot is newer), and a tombstone the server still has
        answers `trip_deleted` (the app then deletes the trip locally). If a step gets `deployment_changed`
        again (e.g. during the server's rollout), the app starts the recovery over; repeating it is harmless.
        Limits, inherent to restoring: deletions made after the restore point are lost with it, so a trip
        deleted on another device in that window can come back; and `deployment_changed` wins over `purged`, so
        a device offline for longer than the tombstone retention can bring back trips deleted elsewhere whose
        tombstones were purged.
      - **Recovery after `purged` or `invalid`** (and unknown reasons): the app must not re-upload. After the
        full walk it drops the local trips the server no longer returns that it had uploaded before (they may
        have been deleted elsewhere); trips it has never uploaded stay and are uploaded as usual.
      - The token is a **commit-ordered watermark**, captured when the walk's first page is served and carried in
        the cursor. Reference implementation (Postgres): every trip row and tombstone stores the id of the
        transaction that last wrote it (`pg_current_xact_id()`), and the token holds
        `pg_snapshot_xmin(pg_current_snapshot())` from the start of the walk: the oldest transaction still running
        at that moment. A walk with `since=T` returns rows whose writer id is at or above T's watermark. Any write
        that had not committed when T was issued has a writer id at or above that watermark, so late-committing
        transactions and equal timestamps can't be missed.
      - `since` is **inclusive** and delivery is **at least once**. An item can come back in a later walk (e.g. a
        row committed just before the token was taken, or one changed again mid-walk). The app applies items
        idempotently: it upserts trips by `id`, keeping the newer `updatedAt`, and treats a repeated tombstone as a
        no-op. A long-running or idle-in-transaction session only holds the watermark back, which means more
        repeats, never a miss. The server keeps that bounded with `idle_in_transaction_session_timeout` and a
        statement timeout.
      - `cursor` is **exclusive**: each page continues strictly after the previous page's last item. In sync
        walks the order is the server's change order (writer transaction id, then `id`), not `updatedAt`.
      - Order of calls: walk `GET /v1/trips?since=S` to its last page and keep its `nextSince` as S'. Then walk
        `GET /v1/trips/deletions?since=S` (same S) to its last page and ignore that walk's own `nextSince`. Then
        store S'. Deletions committed before S' was taken show up in the deletions walk; later ones have writer
        ids at or above S' and show up next time.
      - **Window expiry is tied to the purge boundary, not a fixed age.** Each time the server purges tombstones
        (after the 90-day retention, proposal), it records the member's purge boundary: the latest `deletedAt`
        and the highest writer transaction id among the purged tombstones. A token is accepted only if its
        `issuedAt` is after the boundary's `deletedAt` **and** its watermark is above the boundary's transaction
        id, i.e. no tombstone the app might not have seen yet has been purged. Otherwise both endpoints answer
        `400` (`code=sync_window_expired`, `reason=purged`). The app then does a full `GET /v1/trips` without
        `since` and drops the local trips it had uploaded that the server no longer returns. A token never expires just because of its age while nothing
        it depends on has been purged.
    * **Request limits** (enforced by the server; clients should check them before sending):
      - **Bodies.** Upload operations (`POST /v1/trips/batch`, `POST /v1/telemetry/batches`,
        `POST /v1/vehicles/{vehicleId}/dtc-reports`): at most 1 MiB gzipped and 8 MiB uncompressed (or inflated),
        and at most 500,000 JSON values, where objects, arrays, scalars and member names each count as one (a full
        telemetry batch is about 220,000). Every other body: at most 16 KiB and 4,096 JSON values. Nesting: at most
        64 levels. Over any of these: `413` (`code=batch_too_large`). Member names are case-sensitive; a duplicate
        name, or one that differs from a declared property only by case, is `422`.
      - **Counts and field sizes** are schema limits (`maxItems`, `maxLength`): over one is `422`
        (`code=validation_failed`) with a pointer to the field, never `413`, so don't retry it smaller. An array
        over its `maxItems` is rejected before its items are validated. Batches: 100 trips
        (`TripBatch.trips`), 5,000 samples and 500 events (`TelemetryBatch`).
      - **Per trip:** at most 16 KiB of JSON per `TripUpload`; a larger one fails the batch with `422` at
        `/trips/{i}`. A trip at every field limit is about 7.4 KiB, so only a future loosening of the field
        limits could reach it.
      - **Per page** (`GET /v1/trips`, history and sync): the server ends a page early, with a `nextCursor`,
        before its items pass 512 KiB of JSON, and always returns at least one item. A page with fewer than
        `limit` items is not the last one; only `nextCursor: null` is.
      - **Body arrival:** a body that doesn't arrive in time (uploads 10 s, other bodies 5 s) gets `408`
        (`code=request_timeout`) with `Connection: close`; retry it.
      - **One upload at a time per member:** an upload while the same member's previous upload is still being
        processed gets `429` (`code=upload_in_progress`, `Retry-After: 1`). Send batches one after another.
    * **Busy and unavailable (`503`)**: every `503` from the server carries `Retry-After` and one of these codes:
      `server_busy` (every body slot is busy; `Retry-After: 1`), `uploads_busy` (every upload slot is busy;
      `Retry-After: 5`), `service_unavailable` (the database is unreachable, read-only or being switched, or the
      instance can't confirm its database cluster; `Retry-After: 5`) and `email_sign_in_unavailable` (e-mail
      sign-in is not available on this server yet; `Retry-After: 3600`). A `502`, `503` or `504` without `Retry-After` comes from a
      proxy or load balancer in front of the server: back off exponentially with jitter (e.g. from 30 s, capped at
      1 h) and clamp a very large `Retry-After` to the same cap.
    * **Rate limits**: every response carries `RateLimit-Limit`, `RateLimit-Remaining`, `RateLimit-Reset` (seconds),
      set by middleware (declared explicitly only on a few operations to keep the document readable). Every
      operation documents `429`. `429` and `503` carry `Retry-After`. Clients back off exponentially with jitter.
    * **Unexpected errors**: every operation has a `default` problem+json response (`500`, `502`, `503`, `504`).
    * **Tracing**: clients send `X-Request-Id` (UUID); the server echoes it (or generates one) on every response
      and includes it in problem details.

    ## Versioning policy
    * The major version is in the path (`/v1`). Within `v1` changes are **additive only**: new endpoints,
      new optional request fields, new response fields, new enum values. Clients must ignore unknown fields and
      treat unknown enum values as `other`.
    * Breaking changes ship as `/v2`; `/v1` stays available for at least 12 months after `/v2` is GA (proposal),
      announced with `Deprecation` and `Sunset` headers on `/v1` responses.
    * `info.version` follows SemVer for this document; the app records the spec version it was built against.

    ## Remote-only features
    Stats, rankings and points (`/v1/stats`, `/v1/rankings`, `/v1/me/points`) exist only in Remote mode.
    Everything else mirrors data the app already keeps locally; the server is a sync/backup target.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://{host}
    description: Configured in the app under Settings → Server (advanced). The app appends `/v1/...` paths.
    variables:
      host:
        default: api.example.invalid
  - url: https://sandbox.example.invalid
    description: Sandbox environment the backend developer is asked to provide for contract testing (placeholder host).
security:
  - bearerAuth: []
tags:
  - name: health
    description: Service liveness
  - name: auth
    description: E-mail one-time-code sign-in, token exchange and session lifecycle
  - name: me
    description: Profile and account lifecycle of the calling member
  - name: vehicles
    description: The caller's vehicles
  - name: catalogue
    description: Read-only vehicle catalogue (makes → models → variants)
  - name: reference
    description: Read-only reference data (countries, regions)
  - name: trips
    description: Trip summaries (sync/backup of on-device trips)
  - name: telemetry
    description: Batched OBD/location samples and driving events
  - name: diagnostics
    description: Diagnostic trouble code (DTC) reports
  - name: stats
    description: Remote-only aggregate statistics
  - name: rankings
    description: Remote-only leaderboards
  - name: points
    description: Remote-only reward points
paths:
  /v1/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness / readiness probe
      security: []
      x-legacy-mapping:
        replaces: none
        notes: New. Lets the app's Server settings screen test a base URL before switching to Remote mode.
      responses:
        '200':
          description: Service is up
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/InternalError'}

  /v1/auth/otp:
    post:
      tags: [auth]
      operationId: requestOtp
      summary: Send a one-time sign-in code to an e-mail address
      description: |
        Starts e-mail sign-in. The server generates a random **6-digit** code, stores only a hash of it (never the
        plain code), and e-mails it to the address through the operator's transactional e-mail provider (SMTP or e-mail API). The
        code expires after **10 minutes** and allows at most **5** verification attempts, after which it is
        invalidated and a new code must be requested. Requesting a new code invalidates any earlier unused code for
        that address.

        To prevent account enumeration the response is **always `202`** for any well-formed address, whether or
        not a member exists, and whether or not an e-mail was actually sent (e.g. silently suppressed by the
        per-address limit or a bounce list). There is no separate registration step: the first successful
        `POST /v1/auth/token` with `grantType=email_otp` creates the member.

        Rate limits (proposal): about **3 sends per e-mail address per 15 minutes**, plus **10 send requests per IP
        per 15 minutes** (rolling; IPv6 counted per /64). Exceeding the per-IP limit returns `429` with
        `Retry-After` and the `RateLimit-*` headers. Exceeding the per-address
        limit still returns `202` (to avoid revealing anything about the address); `resendAfter` tells the app
        when to enable its "resend code" button.

        **Per-address lockout (proposal)**: failed verifications are also counted per address **across codes** (see
        `POST /v1/auth/token`). While an address is locked out, this operation still returns `202` with the same
        body, but no code is generated or sent.

        **Test mode (local, ci and sandbox only; never in production)**: test mode is on only when the server was
        started with `AUTH_TEST_MODE=true` **and** `ENV` is exactly `local`, `ci` or `sandbox` (case-sensitive); with
        any other `ENV` value, including unset, the server refuses to start. In test mode, addresses in the reserved
        domain `@test.orangebox.invalid` are not e-mailed; their code is the configured static `AUTH_TEST_CODE`, and
        the response is the same `202`. **When test mode is off** (always in production), a request for an
        `@test.orangebox.invalid` address is rejected with `422` (`code=test_address_rejected`) and nothing is sent.
        This says nothing about any member, because the reserved domain can never belong to one. See
        REQUIREMENTS.md §5 and §11.

        Addresses are trimmed and normalised to lower case before use. The plain address and the code are never
        logged.
      security: []
      x-legacy-mapping:
        replaces: none
        notes: New. Legacy had no verification of the client-supplied e-mail (`loginId`).
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OtpRequest'}
            examples:
              otp:
                value: {email: driver@example.com}
      responses:
        '202':
          description: |
            Accepted. If the address can receive a code, one has been (or will shortly be) sent. The same response
            is returned for unknown addresses.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OtpResponse'}
              example: {expiresIn: 600, resendAfter: 60}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422':
          description: |
            Validation failed, or `code=test_address_rejected`: the address is in the reserved test domain
            `@test.orangebox.invalid` and test mode is off (always the case in production).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: https://api.example.invalid/problems/test-address-rejected
                title: Test address not allowed
                status: 422
                detail: Addresses in the reserved test domain are only accepted when test mode is on.
                instance: /v1/auth/otp
                code: test_address_rejected
                requestId: 0192f1b2-7c1e-7a55-9f0e-2b1d7d2c9a14
                errors:
                  - {pointer: /email, detail: reserved test domain}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/InternalError'}

  /v1/auth/token:
    post:
      tags: [auth]
      operationId: createToken
      summary: Exchange an e-mail one-time code (or a refresh token) for tokens
      description: |
        `grantType=email_otp`: verifies the 6-digit code sent by `POST /v1/auth/otp` for that e-mail address
        (constant-time hash comparison). On success the code is consumed and the server finds the member by the
        normalised e-mail address, or creates one on the first successful sign-in (`isNewMember=true`). The
        address is thereby verified.

        `grantType=refresh_token`: rotates the refresh token. Refresh tokens are opaque, **single use** and live
        **30 days** (proposal). Each use returns a new refresh token; presenting an already-used refresh token
        is treated as theft and **revokes the whole token family** (all sessions descended from that sign-in).

        Both grants return a short-lived access JWT (**15 min**, signed with **ES256**, `kid` header identifying
        the signing key so keys can be rotated) and a new refresh token.

        Errors are `application/problem+json` with `status: 400` and a stable `code`:
        * `invalid_grant`: wrong code, expired code, no pending code for the address, or an unknown, expired,
          revoked or reused refresh token. The response does not say which, to avoid enumeration.
        * `otp_attempts_exceeded`: the code has been invalidated after 5 wrong attempts. Request a new code with
          `POST /v1/auth/otp`.
        * `otp_locked`: the address is temporarily locked out after too many failed verifications across codes
          (below). The response carries `Retry-After` (seconds). No code is checked while locked, so even the
          correct code fails.

        **Per-IP failure limit (proposal)**: at most **30 failed `email_otp` verifications per IP per rolling hour**
        (IPv6 counted per /64), counting every `invalid_grant`, `otp_attempts_exceeded` and `test_address_rejected`
        outcome, including attempts with no pending code. The next request from that IP gets `429` with
        `Retry-After` (seconds until the oldest counted failure leaves the window, at most 3600) and the
        `RateLimit-*` headers, without checking the code; it does not count as a failure for the address. The
        number matches the per-IP send limit: 10 sends per 15 minutes is up to 40 codes an hour, and 30 failures
        leaves room for real users behind a shared (carrier-grade NAT) address while stopping one source from
        cycling through addresses. Sandbox and CI may raise it for the CI runner.

        **Per-address lockout (proposal)**: every failed `email_otp` verification of a pending code for an address
        (wrong code, or a code that expired or was replaced) counts against that address, whichever code it was for.
        An attempt when no code is pending still returns `invalid_grant` and counts toward the per-IP failure limit,
        but **not** toward the address lockout: it cannot succeed, so counting it adds no protection and would let
        anyone lock an address without a single e-mail being sent. **10 failures
        within a rolling 1 hour** lock the address for **1 hour**; **20 failures within a rolling 24 hours** lock it
        for **24 hours**. Together with the per-code (5) and send (3 per 15 min) limits this caps guessing at about
        20 codes a day per address (a 1 in 50,000 chance per day for a 6-digit code). A successful sign-in resets
        the 1-hour counter but not the 24-hour one. The lockout applies to every well-formed address, member or
        not, so it reveals nothing about registration. It blocks only new code sign-ins: existing sessions and
        refresh tokens keep working.

        *Known abuse (documented, accepted for v1)*: because the lockout is per address, an attacker can keep a
        victim's address locked by requesting codes for it and submitting about 20 wrong codes a day. Each attempt
        cycle sends the victim a real code e-mail (because no-pending-code attempts don't count), so the abuse is
        visible. `otp_locked` and its `Retry-After` disclose that an address is currently locked; that is accepted,
        since it reveals nothing about membership. Mitigations: existing sessions keep working; the operator is
        alerted when an address is locked repeatedly or when one IP or ASN causes many lockouts (REQUIREMENTS.md §8);
        the per-IP failure limit (`429`) slows a single source. Per-(address, IP) failure weighting is listed as an
        option in REQUIREMENTS.md §13. A fresh code does **not** bypass a lock, since that would reopen brute force.

        **Refresh concurrency and grace window**: the app must run at most one refresh at a time. As a safety net
        for a retried request whose response was lost, when refresh token *P* is presented again within
        **30 seconds** of its first use **and** the child refresh token *C1* issued from it has not been used yet,
        the server revokes *C1* and returns a fresh pair (*C2* plus a new access JWT) in the same family. At most
        one live child of *P* exists at any time. Access JWTs already issued with *C1* are not revoked and simply
        expire (15 min). A re-send of *P* after 30 seconds, or after *C1* has been used, is reuse: the whole family
        is revoked and the response is `invalid_grant`.
        The grace-revoked child *C1* is never valid again: if *C1* is presented later (by the original client or
        anyone else), that counts as reuse and **revokes the whole family**, exactly like reusing *P*.

        **Test mode (local, ci and sandbox only; never in production)**: test mode is on only when the server was
        started with `AUTH_TEST_MODE=true` **and** `ENV` is exactly `local`, `ci` or `sandbox` (case-sensitive
        allow-list, fail closed). With `AUTH_TEST_MODE=true` and any other `ENV` (unset, empty, `production`,
        `prod`, `Production`, ...) the server **refuses to start**. It also refuses to start unless
        `AUTH_TEST_CODE` is exactly 6 ASCII digits and non-trivial: not all the same digit (`000000`, `111111`, ...)
        and not an ascending or descending run (`012345`, `123456`, ... `456789`, `987654`, ... `543210`).
        In test mode, an `email_otp` grant for an address in the reserved domain `@test.orangebox.invalid`
        succeeds with `AUTH_TEST_CODE` after a `POST /v1/auth/otp` for that address. No e-mail is sent. Everything
        else (request shape, per-code and per-address limits, member creation, tokens) is unchanged, so contract
        tests such as Schemathesis exercise the real `email_otp` grant. Addresses outside the reserved domain
        always use real e-mailed codes. **When test mode is off** (always in production), an `email_otp` grant for
        an `@test.orangebox.invalid` address is rejected with `422` (`code=test_address_rejected`).
      security: []
      x-legacy-mapping:
        replaces: ['/smart.json cmd=checkMember', '/smart.json cmd=regMember', 'POST /mbrLogin.do cmd=login.json']
        notes: Legacy identified members by a client-supplied e-mail (`loginId`) with no verification and used a server session cookie. Replaced by a verified e-mail one-time code + bearer tokens. Registration is implicit on first sign-in (`isNewMember=true`).
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenRequest'}
            examples:
              emailOtp:
                value: {grantType: email_otp, email: driver@example.com, code: '042917', device: {appVersion: 1.0.0, osVersion: Android 15}}
              refresh:
                value: {grantType: refresh_token, refreshToken: rt_01HFXK3Q8J6Z}
      responses:
        '200':
          description: Tokens issued
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
              example:
                accessToken: eyJhbGciOiJFUzI1NiIsImtpZCI6IjIwMjYtMTAifQ.eyJzdWIiOiIwMTkyIn0.c2ln
                tokenType: Bearer
                expiresIn: 900
                refreshToken: rt_01HFXK3Q8J6Z
                refreshExpiresIn: 2592000
                memberId: 0192f1b2-7c1e-7a55-9f0e-2b1d7d2c9a10
                isNewMember: false
        '400':
          description: |
            Malformed request, or the grant was rejected (`invalid_grant`, `otp_attempts_exceeded`, `otp_locked`).
            `otp_locked` responses carry `Retry-After`.
          headers:
            Retry-After: {$ref: '#/components/headers/Retry-After'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                invalidGrant:
                  value:
                    type: https://api.example.invalid/problems/invalid-grant
                    title: Invalid grant
                    status: 400
                    detail: The code or refresh token is invalid or expired.
                    instance: /v1/auth/token
                    code: invalid_grant
                    requestId: 0192f1b2-7c1e-7a55-9f0e-2b1d7d2c9a10
                attemptsExceeded:
                  value:
                    type: https://api.example.invalid/problems/otp-attempts-exceeded
                    title: Too many attempts
                    status: 400
                    detail: Request a new code.
                    instance: /v1/auth/token
                    code: otp_attempts_exceeded
                    requestId: 0192f1b2-7c1e-7a55-9f0e-2b1d7d2c9a11
                locked:
                  value:
                    type: https://api.example.invalid/problems/otp-locked
                    title: Sign-in temporarily locked
                    status: 400
                    detail: Too many failed codes for this address. Try again later.
                    instance: /v1/auth/token
                    code: otp_locked
                    requestId: 0192f1b2-7c1e-7a55-9f0e-2b1d7d2c9a12
        '422':
          description: |
            Validation failed, or `code=test_address_rejected`: the address is in the reserved test domain
            `@test.orangebox.invalid` and test mode is off (always the case in production).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: https://api.example.invalid/problems/test-address-rejected
                title: Test address not allowed
                status: 422
                detail: Addresses in the reserved test domain are only accepted when test mode is on.
                instance: /v1/auth/token
                code: test_address_rejected
                requestId: 0192f1b2-7c1e-7a55-9f0e-2b1d7d2c9a14
                errors:
                  - {pointer: /email, detail: reserved test domain}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}


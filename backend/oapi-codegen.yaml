# oapi-codegen config: run `make generate` (or `go generate ./...`).
# Source of truth is the spec in ../docs/backend/openapi-v2.yaml.
package: api
output: internal/api/api.gen.go
generate:
  std-http-server: true
  strict-server: true
  models: true
  embedded-spec: true
output-options:
  overlay:
    path: oapi-overlay.yaml
    strict: true
compatibility:
  always-prefix-enum-values: true

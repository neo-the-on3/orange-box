# oapi-codegen config: run `make generate` (or `go generate ./...`).
# Source of truth is the spec in ../docs/backend/openapi-v2.yaml.
package: api
output: internal/api/api.gen.go
generate:
  std-http-server: true
  strict-server: true
  models: true
  embedded-spec: true
output-options:
  # Decode request bodies with encoding/json/v2 (exact-case, no duplicate
  # names), so the strict handlers see exactly what kin-openapi validated.
  user-templates:
    strict/strict-http.tmpl: internal/api/templates/strict-http.tmpl
  overlay:
    path: oapi-overlay.yaml
    strict: true
compatibility:
  always-prefix-enum-values: true

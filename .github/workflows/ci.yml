name: CI

# Run manually, just before merging, on a branch rebased onto the latest main (see CONTRIBUTING.md):
#   gh workflow run ci.yml --ref <branch>
# No push or pull_request triggers: they spent Actions minutes on every push, and the dispatched run on the
# rebased branch tests the same tree that lands on main (rebase merge).
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: Build, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # versionCode = commit count

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" > /dev/null

      - name: OpenAPI spec lint (#69)
        run: bash scripts/ci/spec-lint.sh

      - name: Assemble, lint and unit test
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest :app:testReleaseUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore

  release-check:
    name: Release build (R8) has no Simulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Release signing (#74). Optional: without these secrets the release APK is signed with the shared debug key,
      # so the emulator can install it. See docs/release-signing.md for how to create them.
      HAS_RELEASE_KEY: ${{ secrets.ORANGEBOX_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # versionCode = commit count

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" > /dev/null

      - name: Release keystore from secrets
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ORANGEBOX_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ORANGEBOX_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: No release key, sign with the debug key
        if: env.HAS_RELEASE_KEY != 'true'
        run: |
          echo "::notice::ORANGEBOX_KEYSTORE_BASE64 is not set: the release APK is signed with the shared debug key (testing only)"
          echo "ORANGEBOX_RELEASE_DEBUG_SIGNED=true" >> "$GITHUB_ENV"

      - name: Assemble release (R8)
        env:
          ORANGEBOX_KEYSTORE_PASSWORD: ${{ secrets.ORANGEBOX_KEYSTORE_PASSWORD }}
          ORANGEBOX_KEY_ALIAS: ${{ secrets.ORANGEBOX_KEY_ALIAS }}
          ORANGEBOX_KEY_PASSWORD: ${{ secrets.ORANGEBOX_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Check release contents
        run: bash scripts/ci/check-release.sh

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 7

  emulator-smoke:
    name: Emulator smoke (API 34 x86_64)
    needs: [build, release-check]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # versionCode = commit count

      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: app-debug-apk
          path: apk

      - name: Download release APK
        uses: actions/download-artifact@v8
        with:
          name: app-release-apk
          path: apk-release

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: |
            bash scripts/ci/emulator-smoke.sh apk smoke-artifacts
            bash scripts/ci/release-smoke.sh apk-release/apk/release smoke-artifacts

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-smoke
          path: smoke-artifacts
          if-no-files-found: warn
